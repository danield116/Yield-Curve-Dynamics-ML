project:
  name: geometric-no-arbitrage-yield-curve-dynamics
  seed: 42

data:
  source: fred
  start_date: "2001-07-01"
  drop_incomplete_rows: true
  tenors: ["1M", "3M", "6M", "1Y", "2Y", "3Y", "5Y", "7Y", "10Y", "20Y", "30Y"]
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  use_levelscript: true

model:
  latent_dim: 3
  stage_a_variant: student_t_cvae
  stage_b_variant: neural_sde

training:
  batch_size: 128
  epochs_stage_a: 100
  epochs_stage_b: 150
  learning_rate: 0.001

constraints:
  pde_penalty_weight: 0.1
  jacobian_projection_weight: 0.1
  projection_eps: 1e-5

evaluation:
  horizons: [1, 5, 21, 63]
